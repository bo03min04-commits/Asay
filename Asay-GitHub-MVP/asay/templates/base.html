<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Asay - 온라인 콘텐츠 피해 대응을 위한 증거 수집·정리 도구">
  <title>{% block title %}Asay{% endblock %} | 온라인 콘텐츠 증거 정리</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a href="/" class="brand" aria-label="Asay 홈"><span class="brand-icon">A<span class="brand-dot">.</span></span><span>Asay</span></a>
      <nav aria-label="주요 메뉴" class="top-nav"><a href="/" class="nav-link">사건 관리</a><a href="/#workflow" class="nav-link">이용 방법</a><span class="status"><span class="status-light"></span> LOCAL MVP</span></nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer shell"><span>© Asay · 아름답게 말하도록 선도하자</span><span>수집된 정보는 이 기기 안에 저장됩니다. 공개 배포 전 인증·보안 강화가 필요합니다.</span></footer>
</body>
</html>
